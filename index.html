<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>register now</title>
  <style>
  body{
    font-family:arial,sans-serif
    </style>
</head>
<body>
  <h1>
    building & managing HTML5 forms
  </h1>
  <input type="text" name="username" placeholder="enter your name">
  <textarea name="comments" rows="4" cols="50" placeholder="write your comment here"></textarea>
  <button type="submit">submit</button>
  <select name="country">
    <option value="us">united state</option>
    <option value="uk">united kingdom</option>
  </select>
  <label for="email">email:</label>
  <input type="email" id="email" name="email">
  <input type="text" name="username"required>
  <input type="text" name="zip" pattern="[0-9]{5}" title="enter a 5 digit zip code">
  <input type="password" name="password" minlength="8" maxlength="20">
  <input type="email" name="usermail required">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name">
  <fieldset>
    <legend>personal information</legend>
    <label for="fname">first name:</label>
    <input type="text" id="fname" name="fname">
  </fieldset>
  <p class="highlight">please make sure the information filled is correct!</p>
  <div id="unique">unique box</div>
  <p style="color:red">check your details</p>
</body>
</html>
